<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortaleza das Senhas - Edição Definitiva</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: radial-gradient(circle, #0f172a, #020617);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .container {
            background: #1e293b;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #334155;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }
        .theme-desc {
            color: #94a3b8;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }
        .input-field {
            width: 100%;
            padding: 0.85rem;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 1rem;
        }
        .input-field:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #0f172a;
            border: none;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, filter 0.2s;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }
        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            font-weight: bold;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        /* Estatísticas de Jogo (Moedas e Vidas) */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #0f172a;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            font-weight: bold;
            border: 1px solid #334155;
        }
        .coins-display {
            color: #facc15;
        }
        /* Barra de Progresso Visual */
        .progress-track {
            background: #0f172a;
            border-radius: 999px;
            height: 8px;
            width: 100%;
            margin-bottom: 1.2rem;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .progress-fill {
            background: #38bdf8;
            height: 100%;
            width: 0%;
            transition: width 0.4s ease-in-out;
        }
        .scenario-box {
            background: #0f172a;
            padding: 1.25rem;
            border-radius: 10px;
            margin-bottom: 1.2rem;
            border: 1px solid #334155;
            text-align: left;
        }
        #scenario-text {
            font-size: 1.05rem;
            color: #f8fafc;
            line-height: 1.4;
        }
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        .action-btn {
            padding: 0.9rem;
            border-radius: 8px;
            border: none;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
        }
        .action-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .btn-safe {
            background: #166534;
            color: #f0fdf4;
            border: 1px solid #22c55e;
        }
        .btn-danger {
            background: #991b1b;
            color: #fef2f2;
            border: 1px solid #ef4444;
        }
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* Animação de tremor ao errar */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }
        .hidden {
            display: none !important;
        }
        #feedback-container {
            margin-top: 1rem;
            padding: 0.85rem;
            background: #0f172a;
            border-radius: 8px;
            text-align: left;
            border-left: 4px solid #facc15;
            border: 1px solid #334155;
        }
        #feedback-text {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.4;
        }
        #final-score {
            font-size: 1.3rem;
            font-weight: bold;
            color: #38bdf8;
            margin: 0.5rem 0;
        }
        #high-score {
            color: #facc15;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        #end-message {
            color: #cbd5e1;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <!-- Ecrã 1: Registo de Autonomia (Nome do Jogador) -->
        <div id="start-screen" class="screen active">
            <h1>🔐 Fortaleza das Senhas</h1>
            <p class="theme-desc">Modo Campanha Interativa</p>
            <div class="input-group">
                <label for="player-name">Insere o teu Nome de Operador:</label>
                <input type="text" id="player-name" class="input-field" placeholder="Ex: Alex Ciber" maxlength="20">
            </div>
            <button id="start-btn" class="btn">🚀 Começar Missão</button>
        </div>

        <!-- Ecrã 2: Jogo Principal -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <span id="welcome-user">Operador: ---</span>
                <span id="challenge-counter">Fase 1/5</span>
            </div>
            <!-- Barra de Estatísticas (Moedas e Vidas) -->
            <div class="stats-bar">
                <span class="coins-display" id="coins-label">🪙 Moedas: 0</span>
                <span id="lives-label">❤️ Vidas: 3</span>
            </div>
            <!-- Barra de Progresso Visual -->
            <div class="progress-track">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <div class="scenario-box">
                <p id="scenario-text">A carregar cenário...</p>
            </div>
            <div id="action-container" class="action-grid">
                <button id="safe-btn" class="action-btn btn-safe">🛡️ Seguro</button>
                <button id="danger-btn" class="action-btn btn-danger">🚨 Golpe</button>
            </div>
            <div id="feedback-container" class="hidden">
                <p id="feedback-text"></p>
                <button id="next-btn" class="btn" style="margin-top: 0.8rem; font-size: 0.9rem; padding: 0.6rem;">Avançar ➔</button>
            </div>
        </div>

        <!-- Ecrã 3: Fim de Jogo e Recordes -->
        <div id="end-screen" class="screen">
            <h2 id="end-title">Fim de Jogo</h2>
            <p id="final-score">Pontuação: 0/5</p>
            <p id="coins-earned">Moedas ganhas: 0 🪙</p>
            <p id="high-score">Recorde Pessoal: 0</p>
            <p id="end-message">Relatório guardado com sucesso.</p>
            <button id="restart-btn" class="btn">🔄 Jogar Novamente</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const scenarioBank = [
                {
                    text: "Recebeste um SMS urgente do teu banco a solicitar clique num link encurtado 'bit.ly/atualizar-conta'.",
                    isSafe: false,
                    explanation: "Detetado Phishing! Bancos legítimos nunca utilizam URLs encurtados por SMS."
                },
                {
                    text: "Configuraste uma palavra-passe complexa utilizando letras maiúsculas, minúsculas, números e símbolos.",
                    isSafe: true,
                    explanation: "Correto! A alta entropia desta senha bloqueia ataques informáticos de força bruta."
                },
                {
                    text: "Um utilizador desconhecido numa rede social pede o código numérico de autenticação por SMS recebido no teu telemóvel.",
                    isSafe: false,
                    explanation: "Armadilha crítica! Partilhar o código de 2FA concede acesso imediato ao invasor."
                },
                {
                    text: "Ativaste a Autenticação de Dois Fatores (2FA) com uma aplicação de segurança dedicada nas tuas contas essenciais.",
                    isSafe: true,
                    explanation: "Excelente! O 2FA impede o acesso não autorizado mesmo que a palavra-passe seja comprometida."
                },
                {
                    text: "Encontraste uma pen USB desconhecida no chão da escola e decidiste ligá-la imediatamente ao computador.",
                    isSafe: false,
                    explanation: "Perigo de Malware! Dispositivos de armazenamento desconhecidos podem executar código malicioso."
                },
                {
                    text: "Após terminar de utilizar o computador público na biblioteca, fizeste o logout completo e limpaste os dados de navegação.",
                    isSafe: true,
                    explanation: "Procedimento exemplar! Evita que utilizadores seguintes acedam às tuas sessões."
                },
                {
                    text: "Um site de comércio eletrónico oferece prémios incríveis, mas o endereço começa por 'http://' sem ícone de cadeado.",
                    isSafe: false,
                    explanation: "Alerta de Fraude! A ausência de HTTPS indica que a ligação não está encriptada."
                },
                {
                    text: "Optaste por utilizar uma palavra-passe totalmente distinta e exclusiva para cada serviço ou plataforma digital.",
                    isSafe: true,
                    explanation: "Perfeito! Isola o risco para que uma eventual falha num site não afete as restantes contas."
                }
            ];

            let playerName = "";
            let activeScenarios = [];
            let currentIndex = 0;
            let score = 0;
            let coins = 0;
            let lives = 3;

            const startScreen = document.getElementById("start-screen");
            const gameScreen = document.getElementById("game-screen");
            const endScreen = document.getElementById("end-screen");
            const startBtn = document.getElementById("start-btn");
            const restartBtn = document.getElementById("restart-btn");
            const playerNameInput = document.getElementById("player-name");
            const welcomeUser = document.getElementById("welcome-user");
            const scenarioText = document.getElementById("scenario-text");
            const challengeCounter = document.getElementById("challenge-counter");
            const coinsLabel = document.getElementById("coins-label");
            const livesLabel = document.getElementById("lives-label");
            const progressFill = document.getElementById("progress-fill");
            const safeBtn = document.getElementById("safe-btn");
            const dangerBtn = document.getElementById("danger-btn");
            const actionContainer = document.getElementById("action-container");
            const feedbackContainer = document.getElementById("feedback-container");
            const feedbackText = document.getElementById("feedback-text");
            const nextBtn = document.getElementById("next-btn");
            const finalScore = document.getElementById("final-score");
            const coinsEarned = document.getElementById("coins-earned");
            const highScoreText = document.getElementById("high-score");
            const endTitle = document.getElementById("end-title");
            const endMessage = document.getElementById("end-message");

            startBtn.addEventListener("click", () => {
                const name = playerNameInput.value.trim();
                if (name === "") {
                    alert("Por favor, insere o teu nome de operador para continuar!");
                    return;
                }
                playerName = name;
                startGame();
            });

            restartBtn.addEventListener("click", () => {
                endScreen.classList.remove("active");
                startScreen.classList.add("active");
            });

            nextBtn.addEventListener("click", nextChallenge);
            safeBtn.addEventListener("click", () => handleChoice(true));
            dangerBtn.addEventListener("click", () => handleChoice(false));

            function startGame() {
                startScreen.classList.remove("active");
                gameScreen.classList.add("active");
                
                currentIndex = 0;
                score = 0;
                coins = 0;
                lives = 3;

                welcomeUser.textContent = `Operador: ${playerName}`;
                updateStats();

                // Baralha e selecciona 5 cenários aleatórios para a partida
                activeScenarios = [...scenarioBank].sort(() => Math.random() - 0.5).slice(0, 5);
                loadChallenge();
            }

            function loadChallenge() {
                feedbackContainer.classList.add("hidden");
                actionContainer.style.display = "grid";
                safeBtn.disabled = false;
                dangerBtn.disabled = false;

                const current = activeScenarios[currentIndex];
                challengeCounter.textContent = `Fase ${currentIndex + 1}/5`;
                scenarioText.textContent = current.text;

                // Atualiza a barra de progresso visual
                const progressPercentage = (currentIndex / activeScenarios.length) * 100;
                progressFill.style.width = `${progressPercentage}%`;
            }

            function updateStats() {
                coinsLabel.textContent = `🪙 Moedas: ${coins}`;
                livesLabel.textContent = `❤️️ Vidas: ${lives}`;
            }

            function handleChoice(userChoice) {
                safeBtn.disabled = true;
                dangerBtn.disabled = true;

                const current = activeScenarios[currentIndex];
                actionContainer.style.display = "none";

                if (userChoice === current.isSafe) {
                    score++;
                    coins += 20; // Recompensa de 20 moedas por acerto
                    updateStats();
                    feedbackText.innerHTML = `<strong>✅ Correto!</strong> Ganhaste 🪙 20 moedas.<br>${current.explanation}`;
                } else {
                    lives--;
                    updateStats();
                    if (!userChoice) dangerBtn.classList.add("shake");
                    else safeBtn.classList.add("shake");

                    setTimeout(() => {
                        safeBtn.classList.remove("shake");
                        dangerBtn.classList.remove("shake");
                    }, 400);

                    feedbackText.innerHTML = `<strong>❌ Errado!</strong> Perdiste 1 vida.<br>${current.explanation}`;
                }

                feedbackContainer.classList.remove("hidden");

                // Atualiza progresso da fase atual
                const progressPercentage = ((currentIndex + 1) / activeScenarios.length) * 100;
                progressFill.style.width = `${progressPercentage}%`;

                if (lives <= 0) {
                    setTimeout(() => endGame(false), 2000);
                }
            }

            function nextChallenge() {
                currentIndex++;
                if (currentIndex < activeScenarios.length && lives > 0) {
                    loadChallenge();
                } else {
                    endGame(score >= 3);
                }
            }

            function endGame(won) {
                gameScreen.classList.remove("active");
                endScreen.classList.add("active");
                finalScore.textContent = `Pontuação: ${score}/5`;
                coinsEarned.textContent = `Total de Moedas: ${coins} 🪙`;

                let savedHighScore = localStorage.getItem("ultimateHighScore") || 0;
                if (score > savedHighScore) {
                    savedHighScore = score;
                    localStorage.setItem("ultimateHighScore", savedHighScore);
                }
                highScoreText.textContent = `🏆 Recorde Pessoal: ${savedHighScore}/5`;

                if (won && lives > 0) {
                    endTitle.textContent = `🏆 Parabéns, ${playerName}!`;
                    endMessage.textContent = "Missão concluída com sucesso! Demonstraste excelente domínio em cibersegurança.";
                } else {
                    endTitle.textContent = `⚠️ Fim de Jogo, ${playerName}`;
                    endMessage.textContent = "As tuas vidas esgotaram-se. Analisa os conceitos e tenta novamente para bater o recorde!";
                }
            }
        });
    </script>
</body>
</html>

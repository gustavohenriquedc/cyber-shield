<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortaleza das Senhas - O Diário de Léo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #090d16, #1e1b4b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .container {
            background: #0f172a;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 540px;
            text-align: center;
            border: 2px solid #334155;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        .theme-desc {
            color: #94a3b8;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }
        .input-field {
            width: 100%;
            padding: 0.85rem;
            background: #020617;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 1rem;
        }
        .input-field:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #0f172a;
            border: none;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, filter 0.2s;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }
        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }
        /* Estilo do Ambiente de Trabalho / Computador */
        .computer-workspace {
            background: #020617;
            border-radius: 12px;
            border: 2px solid #334155;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            text-align: left;
        }
        .workspace-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 1rem;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 0.5rem;
        }
        /* Caixa de Diálogo com Personagem */
        .character-box {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .avatar {
            width: 55px;
            height: 55px;
            background: #334155;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            flex-shrink: 0;
            border: 2px solid #38bdf8;
        }
        .speech-bubble {
            background: #1e293b;
            padding: 1rem;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #f8fafc;
            line-height: 1.4;
            width: 100%;
            border-left: 4px solid #38bdf8;
        }
        /* Opções de Escolha do Quotidiano */
        .choices-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1rem;
        }
        .choice-btn {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 0.85rem;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            font-size: 0.9rem;
        }
        .choice-btn:hover:not(:disabled) {
            background: #334155;
            border-color: #38bdf8;
        }
        .choice-btn.correct {
            background: #15803d !important;
            border-color: #22c55e !important;
        }
        .choice-btn.incorrect {
            background: #b91c1c !important;
            border-color: #ef4444 !important;
        }
        .choice-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        /* Animação de tremor ao errar */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }
        .hidden {
            display: none !important;
        }
        #feedback-box {
            margin-top: 1rem;
            padding: 0.85rem;
            background: #1e293b;
            border-radius: 8px;
            text-align: left;
            border-left: 4px solid #facc15;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #cbd5e1;
        }
        #final-score {
            font-size: 1.4rem;
            font-weight: bold;
            color: #38bdf8;
            margin: 0.5rem 0;
        }
        #high-score {
            color: #facc15;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        #end-message {
            color: #cbd5e1;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Ecrã 1: Entrada com Nome do Operador -->
        <div id="start-screen" class="screen active">
            <h1>🔐 O Diário de Léo</h1>
            <p class="theme-desc">Missão Quotidiana de Cibersegurança</p>
            <div class="input-group">
                <label for="player-name">Como te chamas, Especialista?</label>
                <input type="text" id="player-name" class="input-field" placeholder="Ex: Beatriz" maxlength="20">
            </div>
            <button id="start-btn" class="btn">💻 Entrar no Sistema</button>
        </div>

        <!-- Ecrã 2: Jogo com História e Estação de Trabalho -->
        <div id="game-screen" class="screen">
            <div class="computer-workspace">
                <div class="workspace-header">
                    <span id="chapter-indicator">Capítulo 1/5</span>
                    <span id="stats-indicator">🪙 Moedas: 0 | ❤ Vidas: 3</span>
                </div>
                <!-- Personagem e Diálogo -->
                <div class="character-box">
                    <div class="avatar">👨‍💻</div>
                    <div class="speech-bubble">
                        <strong id="character-name" style="color: #38bdf8;">Léo:</strong>
                        <p id="narrative-text" style="margin-top: 0.3rem;">A carregar situação...</p>
                    </div>
                </div>
                <!-- Opções de Ação no Quotidiano -->
                <div id="choices-container" class="choices-grid"></div>
            </div>
            <div id="feedback-box" class="hidden">
                <p id="feedback-text"></p>
                <button id="next-btn" class="btn" style="margin-top: 0.8rem; font-size: 0.9rem; padding: 0.6rem;">Continuar História ➔</button>
            </div>
        </div>

        <!-- Ecrã 3: Fim de Jogo / Conclusão -->
        <div id="end-screen" class="screen">
            <h2 id="end-title">Fim da Missão</h2>
            <p id="final-score">Pontuação: 0/5</p>
            <p id="high-score">Recorde Pessoal: 0</p>
            <p id="end-message">O computador do Léo está seguro.</p>
            <button id="restart-btn" class="btn">🔄 Jogar Novamente</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // História baseada em situações do quotidiano com o personagem Léo
            const storyChapters = [
                {
                    dialogue: "Epa, malta! Acabei de ligar o meu computador na sala de estar e recebi uma mensagem urgente no telemóvel a dizer que o meu banco bloqueou a conta. Pede para clicar num link encurtado 'bit.ly/banco-alerta'. O que é que eu faço?",
                    options: [
                        { text: "Clico logo no link para ver o que aconteceu com a minha conta.", isCorrect: false, explanation: "Erro! O Léo caiu num golpe de phishing. Bancos nunca enviam links encurtados por SMS com urgência." },
                        { text: "Ignoro a mensagem e acedo à aplicação oficial do banco para verificar se há algum problema real.", isCorrect: true, explanation: "Excelente escolha! Verificar diretamente na aplicação oficial evita qualquer tentativa de roubo de dados." },
                        { text: "Respondo à mensagem a perguntar qual é a minha senha atual.", isCorrect: false, explanation: "Perigoso! Nunca partilhes dados confidenciais ou senhas por mensagens." }
                    ]
                },
                {
                    dialogue: "Ok, livrei-me desse susto! Agora preciso de criar uma nova palavra-passe para o meu e-mail principal. Qual destas opções devo escolher para ninguém adivinhar?",
                    options: [
                        { text: "Usar o meu nome seguido do ano de nascimento: 'leo2026'.", isCorrect: false, explanation: "Fraco! Dados pessoais são fáceis de adivinhar por qualquer pessoa nas redes sociais." },
                        { text: "Usar uma sequência simples como '12345678'.", isCorrect: false, explanation: "Muito vulnerável! É a primeira senha que programas de invasão testam." },
                        { text: "Combinar letras maiúsculas, minúsculas, números e símbolos especiais (Ex: P#9$mK!2qX).", isCorrect: true, explanation: "Perfeito! A alta complexidade blinda a conta contra ataques de força bruta." }
                    ]
                },
                {
                    dialogue: "Entendido! Ativei a senha forte. Mas agora recebi um aviso a pedir para configurar a Autenticação de Dois Fatores (2FA). Vale a pena perder tempo com isso?",
                    options: [
                        { text: "Sim! Adiciona uma camada extra de segurança, exigindo um código no telemóvel além da senha.", isCorrect: true, explanation: "Fantástico! Mesmo que alguém descubra a senha, não consegue entrar sem o código do 2FA." },
                        { text: "Não, é só uma chatice que atrasa o login nas redes sociais.", isCorrect: false, explanation: "Cuidado! Sem o 2FA, a tua conta fica muito mais vulnerável a invasões." },
                        { text: "Apenas se eu partilhar a senha com os meus amigos.", isCorrect: false, explanation: "Errado. Senhas e códigos de acesso nunca devem ser partilhados." }
                    ]
                },
                {
                    dialogue: "Boa, ativei o 2FA. Agora estou na escola e encontrei uma pen USB perdida no chão do corredor. O que faço com ela?",
                    options: [
                        { text: "Ligo imediatamente ao meu computador para ver se encontro o dono através dos ficheiros.", isCorrect: false, explanation: "Perigo de Malware! Pen drives desconhecidas podem conter códigos maliciosos automáticos." },
                        { text: "Entrego a pen drive na secretaria ou na direção da escola para achados e perdidos.", isCorrect: true, explanation: "Atitude correta! Evita infetar o computador com vírus escondidos no dispositivo." },
                        { text: "Levo para casa e formato-a para ficar com uma pen nova de graça.", isCorrect: false, explanation: "Riscado! Só de ligar a pen ao computador, o malware pode ser executado." }
                    ]
                },
                {
                    dialogue: "Por fim, precisei de usar um computador público na biblioteca da cidade para pesquisar um trabalho. Antes de ir embora, qual é o procedimento ideal?",
                    options: [
                        { text: "Apenas fechar a aba do navegador e levantar-me.", isCorrect: false, explanation: "Inseguro! As tuas contas continuam abertas para o próximo utilizador." },
                        { text: "Desligar o computador diretamente no botão da torre.", isCorrect: false, explanation: "Isso pode danificar o sistema operativo do computador da biblioteca." },
                        { text: "Fazer o logout (terminar sessão) em todas as contas e limpar os dados de navegação.", isCorrect: true, explanation: "Perfeito! Garante total privacidade e impede que terceiros acedam aos teus dados." }
                    ]
                }
            ];

            let playerName = "";
            let currentChapter = 0;
            let score = 0;
            let coins = 0;
            let lives = 3;

            const startScreen = document.getElementById("start-screen");
            const gameScreen = document.getElementById("game-screen");
            const endScreen = document.getElementById("end-screen");
            const startBtn = document.getElementById("start-btn");
            const restartBtn = document.getElementById("restart-btn");
            const playerNameInput = document.getElementById("player-name");
            const chapterIndicator = document.getElementById("chapter-indicator");
            const statsIndicator = document.getElementById("stats-indicator");
            const narrativeText = document.getElementById("narrative-text");
            const choicesContainer = document.getElementById("choices-container");
            const feedbackBox = document.getElementById("feedback-box");
            const feedbackText = document.getElementById("feedback-text");
            const nextBtn = document.getElementById("next-btn");
            const finalScore = document.getElementById("final-score");
            const highScoreText = document.getElementById("high-score");
            const endTitle = document.getElementById("end-title");
            const endMessage = document.getElementById("end-message");

            startBtn.addEventListener("click", () => {
                const name = playerNameInput.value.trim();
                if (name === "") {
                    alert("Por favor, insere o teu nome de operador!");
                    return;
                }
                playerName = name;
                startGame();
            });

            restartBtn.addEventListener("click", () => {
                endScreen.classList.remove("active");
                startScreen.classList.add("active");
            });

            nextBtn.addEventListener("click", nextChapter);

            function startGame() {
                startScreen.classList.remove("active");
                gameScreen.classList.add("active");
                
                currentChapter = 0;
                score = 0;
                coins = 0;
                lives = 3;

                loadChapter();
            }

            function loadChapter() {
                feedbackBox.classList.add("hidden");
                choicesContainer.style.display = "flex";

                const chapter = storyChapters[currentChapter];
                chapterIndicator.textContent = `Capítulo ${currentChapter + 1}/${storyChapters.length}`;
                statsIndicator.textContent = `🪙 Moedas: ${coins} | ❤ Vidas: ${lives}`;
                narrativeText.textContent = chapter.dialogue;

                choicesContainer.innerHTML = "";
                chapter.options.forEach((opt, index) => {
                    const btn = document.createElement("button");
                    btn.textContent = opt.text;
                    btn.classList.add("choice-btn");
                    btn.addEventListener("click", () => selectOption(index, btn));
                    choicesContainer.appendChild(btn);
                });
            }

            function selectOption(selectedIndex, selectedBtn) {
                const chapter = storyChapters[currentChapter];
                const optionButtons = choicesContainer.querySelectorAll(".choice-btn");

                optionButtons.forEach(btn => btn.disabled = true);

                if (chapter.options[selectedIndex].isCorrect) {
                    optionButtons[selectedIndex].classList.add("correct");
                    score++;
                    coins += 30;
                    feedbackText.innerHTML = `<strong>✅ Boa escolha!</strong> ${chapter.options[selectedIndex].explanation}`;
                } else {
                    optionButtons[selectedIndex].classList.add("incorrect");
                    optionButtons[chapter.options.findIndex(o => o.isCorrect)].classList.add("correct");
                    
                    selectedBtn.classList.add("shake");
                    setTimeout(() => selectedBtn.classList.remove("shake"), 400);

                    lives--;
                    feedbackText.innerHTML = `<strong>❌ Ops! Cuidado com isso.</strong> ${chapter.options[selectedIndex].explanation}`;
                }

                statsIndicator.textContent = `🪙 Moedas: ${coins} | ❤ Vidas: ${lives}`;
                feedbackBox.classList.remove("hidden");

                if (lives <= 0) {
                    setTimeout(() => endGame(false), 2500);
                }
            }

            function nextChapter() {
                currentChapter++;
                if (currentChapter < storyChapters.length && lives > 0) {
                    loadChapter();
                } else {
                    endGame(score >= 3);
                }
            }

            function endGame(won) {
                gameScreen.classList.remove("active");
                endScreen.classList.add("active");
                finalScore.textContent = `Pontuação: ${score}/${storyChapters.length} (Moedas: ${coins} 🪙)`;

                let savedHighScore = localStorage.getItem("storyHighScore") || 0;
                if (score > savedHighScore) {
                    savedHighScore = score;
                    localStorage.setItem("storyHighScore", savedHighScore);
                }
                highScoreText.textContent = `🏆 Recorde Pessoal: ${savedHighScore}/${storyChapters.length}`;

                if (won && lives > 0) {
                    endTitle.textContent = `🏆 Missão Concluída, ${playerName}!`;
                    endMessage.textContent = "Ajudaste o Léo a blindar o computador e a navegar com total segurança no quotidiano!";
                } else {
                    endTitle.textContent = `⚠️ Sistema Comprometido, ${playerName}`;
                    endMessage.textContent = "As vidas esgotaram-se devido aos golpes digitais. Analisa as dicas e tenta novamente!";
                }
            }
        });
    </script>
</body>
</html>
